server {
    listen 80;
    listen [::]:80;
    server_name cientificaconsultores.com www.cientificaconsultores.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/cientificaconsultores;
    }

    location / {
        return 301 https://cientificaconsultores.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cientificaconsultores.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cientificaconsultores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cientificaconsultores.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://cientificaconsultores.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cientificaconsultores.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cientificaconsultores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cientificaconsultores.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/cientificaconsultores;
    index index.html;
    error_page 404 /404.html;

    access_log /var/log/nginx/cientificaconsultores.access.log;
    error_log  /var/log/nginx/cientificaconsultores.error.log;

    include /etc/nginx/snippets/cientifica-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /sobre-nosotros.html { return 301 https://cientificaconsultores.com/nosotros.html; }
    location = /asesorias.html      { return 301 https://cientificaconsultores.com/tesis.html; }
    location = /blog/               { return 301 https://cientificaconsultores.com/blog.html; }
    location = /pago.html           { return 410; }
    location ^~ /asesoria-pregrado/ { return 410; }
    location ~ ^/(header|footer|cta|testimonios-clientes|universidades)\.html$ { return 410; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/cientifica-security-headers.conf;
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location /_astro/ {
        include /etc/nginx/snippets/cientifica-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|gif|ico|svg|mp4|woff2)$ {
        include /etc/nginx/snippets/cientifica-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
