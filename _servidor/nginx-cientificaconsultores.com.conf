# Científica Consultores — sitio estático (sin PHP)
# Vhost independiente. No comparte nada con los demás sistemas del servidor.

server {
    listen 80;
    listen [::]:80;
    server_name cientificaconsultores.com www.cientificaconsultores.com;

    # Para renovaciones de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/cientificaconsultores;
    }

    location / {
        return 301 https://cientificaconsultores.com$request_uri;
    }
}

# www -> sin www (canonical, conserva el SEO)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cientificaconsultores.com;

    ssl_certificate     /etc/letsencrypt/live/cientificaconsultores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cientificaconsultores.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://cientificaconsultores.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cientificaconsultores.com;

    ssl_certificate     /etc/letsencrypt/live/cientificaconsultores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cientificaconsultores.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/cientificaconsultores;
    index index.html;

    access_log /var/log/nginx/cientificaconsultores.access.log;
    error_log  /var/log/nginx/cientificaconsultores.error.log;

    # ── Redirecciones heredadas del .htaccess (conservan SEO) ──
    location = /sobre-nosotros.html {
        return 301 https://cientificaconsultores.com/nosotros.html;
    }
    location = /asesorias.html {
        return 301 https://cientificaconsultores.com/tesis.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(js|css|woff2|woff|ttf|eot|svg|png|jpg|jpeg|webp|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
